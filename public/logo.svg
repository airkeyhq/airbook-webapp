<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft 3D Drop Shadow -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>

    <!-- Outer Cloud 3D Body Gradient -->
    <linearGradient id="cloudBodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Top Gloss Highlight Arc -->
    <linearGradient id="topHighlightGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Ambient Cushion Shadow -->
    <linearGradient id="bottomCushionGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.38" />
    </linearGradient>

    <!-- Outer Circle Lobes Definition Rim -->
    <linearGradient id="outerLobeRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Inner Plus Cutout Rim Bevel -->
    <linearGradient id="plusRimGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- 3D Puffy Circle Cloud Body with Soft Subtle 6 Outer Circles & Compact Plus Cutout -->
  <g filter="url(#cloudShadow)">
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      fill="url(#cloudBodyGrad)"
      d="
        M 68.00,45.01 
        Q 100.00,15.00 132.00,45.01 
        Q 174.05,57.12 164.00,100.00 
        Q 174.05,142.88 132.00,154.99 
        Q 100.00,185.00 68.00,154.99 
        Q 25.95,142.88 36.00,100.00 
        Q 25.95,57.12 68.00,45.01 Z 
        
        M 88,72
        A 12,12 0 0,1 112,72
        L 112,84
        A 4,4 0 0,0 116,88
        L 128,88
        A 12,12 0 0,1 128,112
        L 116,112
        A 4,4 0 0,0 112,116
        L 112,128
        A 12,12 0 0,1 88,128
        L 88,116
        A 4,4 0 0,0 84,112
        L 72,112
        A 12,12 0 0,1 72,88
        L 84,88
        A 4,4 0 0,0 88,84
        Z
      "
    />

    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      fill="url(#topHighlightGrad)"
      opacity="0.85"
      d="
        M 68.00,45.01 
        Q 100.00,15.00 132.00,45.01 
        Q 174.05,57.12 164.00,100.00 
        Q 174.05,142.88 132.00,154.99 
        Q 100.00,185.00 68.00,154.99 
        Q 25.95,142.88 36.00,100.00 
        Q 25.95,57.12 68.00,45.01 Z 
        
        M 88,72
        A 12,12 0 0,1 112,72
        L 112,84
        A 4,4 0 0,0 116,88
        L 128,88
        A 12,12 0 0,1 128,112
        L 116,112
        A 4,4 0 0,0 112,116
        L 112,128
        A 12,12 0 0,1 88,128
        L 88,116
        A 4,4 0 0,0 84,112
        L 72,112
        A 12,12 0 0,1 72,88
        L 84,88
        A 4,4 0 0,0 88,84
        Z
      "
    />

    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      fill="url(#bottomCushionGrad)"
      d="
        M 68.00,45.01 
        Q 100.00,15.00 132.00,45.01 
        Q 174.05,57.12 164.00,100.00 
        Q 174.05,142.88 132.00,154.99 
        Q 100.00,185.00 68.00,154.99 
        Q 25.95,142.88 36.00,100.00 
        Q 25.95,57.12 68.00,45.01 Z 
        
        M 88,72
        A 12,12 0 0,1 112,72
        L 112,84
        A 4,4 0 0,0 116,88
        L 128,88
        A 12,12 0 0,1 128,112
        L 116,112
        A 4,4 0 0,0 112,116
        L 112,128
        A 12,12 0 0,1 88,128
        L 88,116
        A 4,4 0 0,0 84,112
        L 72,112
        A 12,12 0 0,1 72,88
        L 84,88
        A 4,4 0 0,0 88,84
        Z
      "
    />

    <!-- Subtle Outer Lobe Soft Definition Rim -->
    <path
      d="
        M 68.00,45.01 
        Q 100.00,15.00 132.00,45.01 
        Q 174.05,57.12 164.00,100.00 
        Q 174.05,142.88 132.00,154.99 
        Q 100.00,185.00 68.00,154.99 
        Q 25.95,142.88 36.00,100.00 
        Q 25.95,57.12 68.00,45.01 Z
      "
      fill="none"
      stroke="url(#outerLobeRimGrad)"
      stroke-width="1.5"
      opacity="0.4"
    />

    <!-- Plus Cutout Inner Rim 3D Bevel Line -->
    <path
      d="
        M 88,72
        A 12,12 0 0,1 112,72
        L 112,84
        A 4,4 0 0,0 116,88
        L 128,88
        A 12,12 0 0,1 128,112
        L 116,112
        A 4,4 0 0,0 112,116
        L 112,128
        A 12,12 0 0,1 88,128
        L 88,116
        A 4,4 0 0,0 84,112
        L 72,112
        A 12,12 0 0,1 72,88
        L 84,88
        A 4,4 0 0,0 88,84
        Z
      "
      fill="none"
      stroke="url(#plusRimGrad)"
      stroke-width="2.5"
      opacity="0.75"
    />
  </g>
</svg>
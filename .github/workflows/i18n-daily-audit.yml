name: Daily i18n & Zero-Hardcode Compliance Audit

on:
  schedule:
    # Runs everyday at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  audit-i18n:
    name: Audit i18n & Dictionary Symmetry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run i18n Auditor
        run: npm run audit:i18n

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-audit-report
          path: i18n-audit-report.md
